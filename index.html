ef.theme==='dark'?(i%2===0?'#596e73':'#b2a694'):(i%2===0?'#aa563e':'#dec18d'));ctx.fill();let count=Math.abs(game.p[i]),col=Math.sign(game.p[i]);for(let k=0;k<Math.min(count,7);k++)checker(x,base+(top?1:-1)*(30+k*43),col,count>7&&k===6?count:null);ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff5d9';if(viewFlip()){ctx.save();ctx.translate(x,top?25:705);ctx.scale(1,-1);ctx.fillText(String(i+1),0,5);ctx.restore();}else ctx.fillText(String(i+1),x,top?25:705);}ctx.textAlign='center';for(let c of [1,-1]){let ct=game.bar[idx(c)];for(let j=0;j<Math.min(ct,5);j++)checker(mid,c===1?CH/2+48+j*38:CH/2-48-j*38,c,ct>5&&j===4?ct:null);}if(lastMove&&Date.now()-lastMove.time<1800){for(let loc of [lastMove.from,lastMove.to]){let px=loc==='bar'?mid:loc==='off'?offSpot(game.turn)[0]:xOf(loc),py=loc==='bar'?CH/2:loc==='off'?offSpot(game.turn)[1]:(loc>=12?YT+65:YB-65);ctx.beginPath();ctx.arc(px,py,29,0,Math.PI*2);ctx.lineWidth=6;ctx.strokeStyle='#ffdf72';ctx.stroke();}}if(game.rolled&&!diceAnimating&&allowed()&&selected===null){const origins=[...new Set(legal(game).map(m=>m.from))];ctx.save();ctx.strokeStyle='#f7d887';ctx.lineWidth=3;for(const i of origins){const x=i==='bar'?mid:xOf(i),y=i==='bar'?(game.turn===1?CH/2+50:CH/2-50):(i>=12?YT+50:YB-50);ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.stroke();}ctx.restore();}if(selected!==null){ctx.strokeStyle='#ffdc61';ctx.lineWidth=6;let pos=selected==='bar'?[mid,game.turn===1?CH/2+50:CH/2-50]:[xOf(selected),selected>=12?YT+40:YB-40];ctx.beginPath();ctx.arc(...pos,27,0,Math.PI*2);ctx.stroke();for(let m of targets){let pos=m.to==='off'?offSpot(game.turn):[xOf(m.to),m.to>=12?YT+42:YB-42];ctx.beginPath();ctx.arc(...pos,26,0,Math.PI*2);ctx.fillStyle='#a6ec8a88';ctx.fill();ctx.strokeStyle='#b9ff98';ctx.lineWidth=3;ctx.stroke();}}if(travel){checker(travel.x,travel.y,travel.c,null);}ctx.restore();drawBoardDice();if(pref.place==='dice')drawDiceControls();}
function checker(x,y,c,label){ctx.save();ctx.shadowColor='#000a';ctx.shadowBlur=8;ctx.shadowOffsetY=5;ctx.beginPath();ctx.ellipse(x,y+3,22,22,0,0,Math.PI*2);ctx.fillStyle=c===1?'#c2ae86':'#0a1517';ctx.fill();ctx.shadowBlur=2;ctx.shadowOffsetY=1;let shine=ctx.createRadialGradient(x-9,y-11,2,x,y,22);if(c===1){shine.addColorStop(0,'#fffefa');shine.addColorStop(.5,'#f0e4c9');shine.addColorStop(1,'#c6ae86');}else{shine.addColorStop(0,'#667376');shine.addColorStop(.5,'#334347');shine.addColorStop(1,'#10191c');}ctx.beginPath();ctx.arc(x,y,21,0,Math.PI*2);ctx.fillStyle=shine;ctx.fill();ctx.strokeStyle=c===1?'#ad946d':'#91a5a2';ctx.lineWidth=1.8;ctx.stroke();ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.strokeStyle=c===1?'#d9c39b':'#394f51';ctx.lineWidth=1.6;ctx.stroke();if(label){ctx.fillStyle=c===1?'#2a281f':'#f6e9d0';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(String(label),x,y+5);}ctx.restore();}
function hit(x,y){if(viewFlip())y=CH-y;if(x>=942)return 'off';if(x<58)return null;if(x>=mid-barW/2&&x<=mid+barW/2)return 'bar';let top=y<CH/2;for(let i=top?12:0;i<(top?24:12);i++)if(Math.abs(x-xOf(i))<pointW/2)return i;return null;}
function choose(pos){if(game.winner||!game.rolled||diceAnimating||!allowed())return;let ml=legal(game);if(selected!==null){let candidates=ml.filter(m=>m.from===selected&&m.to===pos);if(candidates.length){doMove(candidates[0]);return;}}if(ml.some(m=>m.from===pos)){const options=ml.filter(m=>m.from===pos);if(options.length===1){doMove(options[0]);return;}selected=pos;targets=options;game.message='Hedefi seç';}else{selected=null;targets=[];}render();}
let dragStart=null,ignoreClick=false;
const boardPoint=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*CW/r.width,y:(e.clientY-r.top)*CH/r.height};};const gamePoint=p=>({x:p.x,y:viewFlip()?CH-p.y:p.y});
cv.addEventListener('click',e=>{const p=boardPoint(e),id=controlHit(p.x,p.y);if(!id)return;e.stopImmediatePropagation();e.preventDefault();const button=$(id);if(button&&!button.disabled)button.click();},true);
cv.addEventListener('pointerdown',e=>{if(!game?.rolled||diceAnimating||!allowed())return;let p=boardPoint(e);dragStart={pos:hit(p.x,p.y),x:p.x,y:p.y};});
cv.addEventListener('pointerup',e=>{if(!dragStart)return;const p=boardPoint(e),start=dragStart;dragStart=null;if(Math.hypot(p.x-start.x,p.y-start.y)<22)return;const end=hit(p.x,p.y);const m=legal(game).find(m=>m.from===start.pos&&m.to===end);if(m){ignoreClick=true;doMove(m);setTimeout(()=>ignoreClick=false,90);}});
cv.addEventListener('pointercancel',()=>dragStart=null);
cv.addEventListener('click',e=>{if(ignoreClick)return;let p=boardPoint(e);choose(hit(p.x,p.y));});
function showRollAnimation(a,b){animateBoardDice(a,b);const token=++rollToken;const d1=$('die1'),d2=$('die2');d1.classList.add('rolling');d2.classList.add('rolling');let ticks=0;let it=setInterval(()=>{if(token!==rollToken){clearInterval(it);return;}d1.textContent=1+Math.floor(Math.random()*6);d2.textContent=1+Math.floor(Math.random()*6);if(++ticks>=12){clearInterval(it);d1.classList.remove('rolling');d2.classList.remove('rolling');d1.textContent=a;d2.textContent=b;render();}},65);}
function render(){draw();const overlay=$('gameOverlay');$('turnLabel').textContent=(game.winner?((game.winner===1?'⚪ Beyaz':'⚫ Siyah')+' kazandı'):((game.turn===1?'⚪ Beyaz':'⚫ Siyah')+(mode==='bot'&&game.turn===-1?' • Bot': '')+' oynuyor'));$('turnStep').textContent=game.winner?'🏁 El tamamlandı':!game.rolled?'🎲 Zar bekleniyor':legal(game).length?'👆 Pul seç ve hareket ettir':'✅ Tur tamamlandı';$('moveLog')&&($('moveLog').innerHTML=moveLogs.length?moveLogs.map(x=>'<li><span>'+x.who+' · '+x.label+'</span><span>🎲 '+x.die+'</span></li>').join(''):'<li>Henüz hamle yok</li>');$('whiteScore').textContent=game.scores[0];$('blackScore').textContent=game.scores[1];$('status').textContent=game.winner?((game.winner===1?'Beyaz':'Siyah')+' eli kazandı'):(!game.rolled?'Zar at':legal(game).length?'Pulunu oyna':'Tur tamamlandı');if(!diceAnimating){$('die1').textContent=game.rolled?(game.dice[0]||'✓'):'–';$('die2').textContent=game.rolled?(game.dice[1]||'✓'):'–';}$('die1').classList.toggle('black',game.turn===-1);$('die2').classList.toggle('black',game.turn===-1);$('remaining').textContent='';$('roll').disabled=!allowed()||game.rolled||!!game.winner;$('undo').disabled=!history.length||!allowed();$('end').disabled=!allowed()||!game.rolled||legal(game).length>0||!!game.winner;$('end').classList.toggle('ready',game.rolled&&!legal(game).length&&!game.winner);$('new').disabled=mode==='online'&&(!onlineReady||peerRole!=='host');$('goal').disabled=game.scores.some(Boolean)||mode==='online'&&peerRole==='guest';$('roll').classList.toggle('ready',!$('roll').disabled);if(game.winner){const matchDone=game.scores[idx(game.winner)]>=game.goal;$('gameOverBadge').textContent=matchDone?'Maç bitti':'El bitti';$('gameOverTitle').textContent=(game.winner===1?'⚪ Beyaz':'⚫ Siyah')+' kazandı';$('gameOverText').textContent=game.message;$('overlayWhiteScore').textContent=game.scores[0];$('overlayBlackScore').textContent=game.scores[1];overlay.classList.add('show');$('playAgain').textContent=matchDone?'Yeni maça başla':'Sonraki eli başlat';}else overlay.classList.remove('show');}
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!['BUTTON','INPUT','SELECT','TEXTAREA','CANVAS'].includes(document.activeElement?.tagName)&&!$('roll').disabled){e.preventDefault();$('roll').click();}});$('roll').onclick=roll;$('end').onclick=finishTurn;$('undo').onclick=()=>{if(!history.length||!allowed())return;game=history.pop();selected=null;targets=[];render();broadcast();};$('new').onclick=()=>{if(!confirm('Yeni oyun başlasın mı? Mevcut el sıfırlanacak.'))return;start(!!game.winner&&game.scores.every(s=>s<game.goal));};$('playAgain').onclick=()=>start(!!game.winner&&game.scores.every(s=>s<game.goal));$('goal').onchange=()=>{if(!game.scores.some(Boolean)){game.goal=Number($('goal').value);broadcast();}};
function switchMode(m){if(mode==='online'&&m!=='online')disconnect();mode=m;for(let [id,val] of [['botMode','bot'],['localMode','local'],['onlineMode','online']]){$(id).className=m===val?'active':'ghost';}$('onlineBox').classList.toggle('on',m==='online');$('conn').textContent=m==='online'?'● Arkadaş bekleniyor':m==='bot'?'Bilgisayara karşı':'Aynı cihazda 2 oyuncu';$('conn').className=m==='online'?'small peerWaiting':'small';start();if(m==='online'){let room=new URL(location.href).searchParams.get('room');$('join').classList.toggle('hide',!room);if(room){$('invite').value=location.href;$('peerStatus').textContent='Davet bağlantısı algılandı. Katıl düğmesine basın.';}}}
$('botMode').onclick=()=>switchMode('bot');$('localMode').onclick=()=>switchMode('local');$('onlineMode').onclick=()=>switchMode('online');
function disconnect(){$('share').disabled=true;$('copyInvite').disabled=true;if(connection){connection.close();connection=null;}if(peer){peer.destroy();peer=null;}onlineReady=false;peerRole=null;}
function setupConn(conn,role){connection=conn;peerRole=role;conn.on('open',()=>{onlineReady=true;$('peerStatus').textContent='Rakip bağlandı! '+(role==='host'?'Beyaz sizsiniz.':'Siyah sizsiniz.');$('conn').textContent='● Arkadaşın masaya katıldı';$('conn').className='small peerConnected';$('peerStatus').textContent='✓ Arkadaşın katıldı · Oyun hazır';if(role==='host')broadcast();render();});conn.on('data',data=>{if(!data||data.type!=='state'||!data.game)return;if(role==='host')return;let g=data.game;if(!Array.isArray(g.p)||g.p.length!==24||!Array.isArray(g.dice))return;game=g;boardDice=game.rolled?(game.lastRoll||[game.dice[0],game.dice[1]||game.dice[0]]):null;rollPhase=1000;history=[];selected=null;targets=[];moveLogs=[];lastMove=null;$('goal').value=String(game.goal);render();});conn.on('data',()=>{});if(role==='host'){conn.on('data',d=>{if(d?.type==='move'&&game.turn===-1&&game.rolled){let m=legal(game).find(x=>x.from===d.from&&x.to===d.to&&x.die===d.die);if(m)doMove(m);}if(d?.type==='roll'&&game.turn===-1&&!game.rolled){let a=fairDie(),b=fairDie();game.dice=a===b?[a,a,a,a]:[a,b];game.rolled=true;game.lastRoll=[a,b];game.message='Siyah '+a+'–'+b+' attı.';showRollAnimation(a,b);broadcast();render();}if(d?.type==='end'&&game.turn===-1&&game.rolled&&!legal(game).length)finishTurn();});}conn.on('close',()=>{onlineReady=false;$('conn').textContent='● Arkadaş ayrıldı';$('conn').className='small peerWaiting';$('peerStatus').textContent='Bağlantı kesildi. Yeni oda açarak yeniden deneyin.';render();});conn.on('error',()=>{$('peerStatus').textContent='Bağlantı hatası.';});}
function broadcast(){if(mode==='online'&&peerRole==='host'&&connection?.open)connection.send({type:'state',game:clone(game)});}
// Guest UI sends intents; host owns dice and board state.
const origChoose=choose;function guestClick(pos){if(!onlineReady||game.turn!==-1||!game.rolled||game.winner)return;let ml=legal(game);if(selected!==null){let m=ml.find(m=>m.from===selected&&m.to===pos);if(m){selected=null;targets=[];connection.send({type:'move',...m});return;}}if(ml.some(m=>m.from===pos)){selected=pos;targets=ml.filter(m=>m.from===pos);}else{selected=null;targets=[];}render();}
cv.removeEventListener('nothing',()=>{}); // touch and mouse clicks use canvas click listener below via capture
cv.addEventListener('click',e=>{if(mode==='online'&&peerRole==='guest'){e.stopImmediatePropagation();let r=cv.getBoundingClientRect();guestClick(hit((e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height));}},true);
$('roll').addEventListener('click',()=>{if(mode==='online'&&peerRole==='guest'&&onlineReady&&!game.rolled)connection.send({type:'roll'});},true);
$('end').addEventListener('click',()=>{if(mode==='online'&&peerRole==='guest'&&onlineReady&&game.rolled&&!legal(game).length)connection.send({type:'end'});},true);
// Guest buttons must not be disabled: controls are actions sent to host.
const oldRender=render;render=function(){oldRender();if(mode==='online'&&peerRole==='guest'&&onlineReady){$('roll').disabled=game.turn!==-1||game.rolled||!!game.winner;$('end').disabled=game.turn!==-1||!game.rolled||legal(game).length>0||!!game.winner;$('undo').disabled=true;}};
function peerError(err){$('peerStatus').textContent='Online bağlantı kurulamadı: '+(err?.message||'Sunucu erişilemiyor');}
$('host').onclick=()=>{if(typeof Peer==='undefined')return peerError(new Error('PeerJS yüklenemedi. İnternet bağlantısını kontrol edin.'));disconnect();let code=Math.random().toString(36).slice(2,10);peerRole='host';peer=new Peer(ROOM+code);peer.on('open',()=>{let u=new URL(location.href);u.searchParams.set('room',code);$('invite').value=u.href;$('share').disabled=false;$('copyInvite').disabled=false;$('peerStatus').textContent='Masa hazır · Davet bağlantısını paylaşın.';});peer.on('connection',c=>{if(connection?.open){c.close();return;}setupConn(c,'host');});peer.on('error',peerError);start();};
$('join').onclick=()=>{if(typeof Peer==='undefined')return peerError(new Error('PeerJS yüklenemedi.'));let code=new URL(location.href).searchParams.get('room');if(!/^[a-z0-9]{8}$/.test(code||''))return peerError(new Error('Geçersiz oda kodu.'));disconnect();peerRole='guest';peer=new Peer();peer.on('open',()=>{setupConn(peer.connect(ROOM+code,{reliable:true}),'guest');$('peerStatus').textContent='Masaya bağlanılıyor...';});peer.on('error',peerError);};$('copy').onclick=async()=>{let v=$('invite').value;if(!v)return;try{await navigator.clipboard.writeText(v);$('peerStatus').textContent='Davet bağlantısı kopyalandı.';}catch{$('invite').select();$('peerStatus').textContent='Bağlantıyı seçip kopyalayın.';}};
$('controlPlace').onchange=()=>{pref.place=$('controlPlace').value;localStorage.setItem('tk_place',pref.place);syncPrefs()};$('boardTheme').onchange=()=>{pref.theme=$('boardTheme').value;localStorage.setItem('tk_theme',pref.theme);syncPrefs()};$('share').onclick=async()=>{const url=$('invite').value;if(!url)return;try{if(navigator.share)await navigator.share({title:'Tavla Kulübü',text:'Bir el tavla oynayalım mı?',url});else{await navigator.clipboard.writeText(url);$('peerStatus').textContent='Davet bağlantısı kopyalandı';}}catch(e){if(e.name!=='AbortError')$('peerStatus').textContent='Paylaşılamadı, bağlantıyı kopyalayın';}};$('copyInvite').onclick=()=>$('copy').click();if(new URL(location.href).searchParams.has('room'))switchMode('online');else start();syncPrefs();
})();
