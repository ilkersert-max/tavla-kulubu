<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tavla Modern | Arkadaşla ve Bilgisayarla</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header><h1>◆ Tavla Modern</h1><span id="connection">Bağlantı yok</span></header><section id="lobby"><h2>Nasıl oynamak istersin?</h2><p>Bilgisayara karşı hemen başla veya arkadaşına masa kodu ya da davet bağlantısı gönder.</p><div class="entry-actions"><button id="botStart" type="button">🤖 Bilgisayara Karşı</button><button id="createRoom" type="button">🎲 Masa Aç</button></div><p>Arkadaşının verdiği kodla katıl:</p><form id="join"><input id="code" pattern="[A-Za-z0-9]{5,8}" maxlength="8" placeholder="5–8 karakterlik oda kodu" required><button>Kodla Oyuna Katıl</button></form><p id="lobbyError"></p></section><section id="game" hidden><div class="toolbar"><strong id="identity"></strong><span id="turn"></span><button id="roll">🎲 Zar At</button><button id="leave">Ayrıl</button></div><div id="inviteBox" hidden><strong>Masa kodu: <span id="roomCode"></span></strong><p id="inviteLink"></p><button id="copyInvite" type="button">Davet bağlantısını kopyala</button></div><div class="feedback" id="notice"></div><div class="dice-strip"><strong>Zarlar:</strong> <span id="dice"></span> <span id="counters"></span></div><div class="board-scroll"><div class="board" id="board"><div class="quad tl" id="tl"></div><div class="quad tr" id="tr"></div><div class="quad bl" id="bl"></div><div class="quad br" id="br"></div><div id="bar" class="bar"><div id="barWhite"></div><b>BAR</b><div id="barBlack"></div></div><div class="tray top" id="whiteTray"><div class="face"><strong id="whiteOff">0</strong><small>Beyaz Toplama</small></div></div><div class="tray bottom" id="blackTray"><div class="face"><strong id="blackOff">0</strong><small>Siyah Toplama</small></div></div></div></div><div class="footer"><span>⚫ Siyah 24 → 1 · ⚪ Beyaz 1 → 24</span></div></section></main><script type="module" src="/app.js"></script></body></html>
