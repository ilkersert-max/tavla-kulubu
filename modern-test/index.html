<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tavla Kulübü | Yeni motor testi</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#112423;color:#f6e7c6;font:15px system-ui}#app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:6px}.top strong{font-size:19px}.actions{display:flex;gap:5px}button{background:#27413c;color:#f9dfad;border:1px solid #ae956c;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}#stage{min-height:0;flex:1;display:grid;place-items:center}canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:1000/720;object-fit:contain;touch-action:none;flex:none}footer{font-size:12px;opacity:.8}@media(max-width:600px){.top strong{font-size:14px}button{font-size:12px;padding:7px}}@media(max-height:450px){footer{display:none}}
</style></head><body><div id="app"><header class="top"><strong>◆ Tavla Kulübü <small style="font-weight:normal;font-size:11px">— yeni motor testi</small></strong><div class="actions"><button id="roll">🎲 Zar at</button><button id="undo">↶ Geri al</button><button id="end">✓ Sırayı bitir</button><button id="view">Perspektif: Beyaz</button><button id="full">Tam ekran</button></div></header><div id="stage"><canvas id="board" width="1000" height="720"></canvas></div><footer id="status">Tahta ve perspektif testi · Henüz oynanabilir oyun değildir.</footer></div><script>
'use strict';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),status=document.getElementById('status');const gameState={points:Array(24).fill(0),turn:'white',viewSide:'white',dice:[],selected:null,bar:{white:0,black:0},off:{white:0,black:0},rolled:false,revision:0};for(const [i,n] of [[0,2],[11,5],[16,3],[18,5],[5,-5],[7,-3],[12,-5],[23,-2]])gameState.points[i]=n;const W=1000,H=720,left=64,right=922,barL=479,barR=519;
function xpos(i){const n=i<12?11-i:i-12;const w=(right-left-(barR-barL))/12;return n<6?left+(n+.5)*w:barR+(n-6+.5)*w}
function paint(){ctx.save();ctx.fillStyle='#caa477';ctx.fillRect(0,0,W,H);if(gameState.viewSide==='black'){ctx.translate(972,H);ctx.rotate(Math.PI)}ctx.fillStyle='#16485e';ctx.fillRect(34,40,904,640);ctx.fillStyle='#89502e';ctx.fillRect(barL,40,barR-barL,640);for(let i=0;i<24;i++){const x=xpos(i),top=i>=12,y=top?46:674;ctx.beginPath();ctx.moveTo(x-31,y);ctx.lineTo(x+31,y);ctx.lineTo(x,top?310:410);ctx.closePath();ctx.fillStyle=i%2?'#cd5e52':'#f3e9d8';ctx.fill();if(gameState.selected===i){ctx.strokeStyle='#f8dc70';ctx.lineWidth=4;ctx.stroke()}if(legalMoves().some(m=>m.to===i&&m.from===gameState.selected)){ctx.save();ctx.strokeStyle='#f7de68';ctx.lineWidth=5;ctx.stroke();ctx.restore()}}for(let i=0;i<24;i++){const n=gameState.points[i];if(!n)continue;for(let j=0;j<Math.abs(n);j++){const x=xpos(i),y=(i>=12?75:645)+(i>=12?1:-1)*j*37;ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fillStyle=n>0?'#e9d7b7':'#1c303b';ctx.fill();ctx.strokeStyle=n>0?'#947449':'#acd2d5';ctx.lineWidth=3;ctx.stroke()}}ctx.restore();ctx.fillStyle='#202b2b';ctx.fillRect(940,104,46,512);ctx.fillStyle='#f7d9a9';ctx.font='bold 14px system-ui';ctx.save();ctx.translate(967,360);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('TOPLAMA →',0,0);ctx.restore()}
let pending=false;function invalidate(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;paint()})}
function pointFromEvent(ev){const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H),x0=r.left+(r.width-W*scale)/2,y0=r.top+(r.height-H*scale)/2;let x=(ev.clientX-x0)/scale,y=(ev.clientY-y0)/scale;if(x<0||y<0||x>W||y>H)return null;if(gameState.viewSide==='black'){x=972-x;y=H-y}return{x,y}}
// Core rules are kept independent from Canvas. White moves upward in index, black downward.
const history=[],sideNum=side=>side==='white'?1:-1,owner=n=>n>0?'white':n<0?'black':null;
function basicMoves(state,die){const side=state.turn,sign=sideNum(side),bar=state.bar[side],out=[];const froms=bar?['bar']:Array.from({length:24},(_,i)=>i).filter(i=>state.points[i]*sign>0);
 for(const from of froms){const to=from==='bar'?(side==='white'?die-1:24-die):from+sign*die;
  if(to>=0&&to<24){if(state.points[to]*sign>=-1)out.push({from,to,die});continue;}
  const home=side==='white'?[18,23]:[0,5],allHome=!bar&&state.points.every((n,i)=>n*sign<=0||(i>=home[0]&&i<=home[1]));
  if(!allHome)continue;
  const exact=side==='white'?to===24:to===-1;
  const farther=state.points.some((n,i)=>n*sign>0&&(side==='white'?i<from:i>from));
  if(exact||!farther)out.push({from,to:'off',die});
 }return out}
function cloneState(x){return {points:[...x.points],turn:x.turn,viewSide:x.viewSide,dice:[...x.dice],bar:{...x.bar},off:{...x.off},rolled:x.rolled,selected:x.selected,revision:x.revision}}
function simulate(x,m){const sign=sideNum(x.turn);if(m.from==='bar')x.bar[x.turn]--;else x.points[m.from]-=sign;if(m.to==='off')x.off[x.turn]++;else{if(x.points[m.to]===-sign){x.points[m.to]=0;x.bar[x.turn==='white'?'black':'white']++}x.points[m.to]+=sign}const di=x.dice.indexOf(m.die);if(di>=0)x.dice.splice(di,1)}
function canFinish(x){if(!x.dice.length)return true;return !x.dice.some(d=>basicMoves(x,d).length)}
function legalMoves(){const x=gameState;if(!x.rolled||!x.dice.length)return[];const raw=x.dice.flatMap(d=>basicMoves(x,d));if(!raw.length)return[];
 // Enforce use of maximal number of dice and the higher die when only one of two different dice can be played.
 const longest=(st,depth=0)=>{if(depth>=4||!st.dice.length)return 0;let best=0;for(const d of [...new Set(st.dice)])for(const m of basicMoves(st,d)){const n=cloneState(st);simulate(n,m);best=Math.max(best,1+longest(n,depth+1))}return best};
 let max=0,result=[];for(const m of raw){const next=cloneState(x);simulate(next,m);const count=1+longest(next);if(count>max){max=count;result=[m]}else if(count===max)result.push(m)}
 if(max===1&&x.dice.length===2&&x.dice[0]!==x.dice[1]){const high=Math.max(...x.dice);if(result.some(m=>m.die===high))result=result.filter(m=>m.die===high)}
 return result}
function refresh(){document.getElementById('roll').disabled=gameState.rolled;document.getElementById('undo').disabled=!history.length;document.getElementById('end').disabled=!gameState.rolled||!canFinish(gameState);const msg=gameState.rolled?(gameState.dice.length?'Zarlar: '+gameState.dice.join(', '):'Hamleler tamamlandı'):'Zar atılacak';status.textContent=(gameState.turn==='white'?'Beyaz':'Siyah')+' oynuyor · '+msg+' · Kırık: '+gameState.bar.white+'/'+gameState.bar.black+' · Toplanan: '+gameState.off.white+'/'+gameState.off.black;invalidate()}
function doMove(m){history.push(cloneState(gameState));simulate(gameState,m);gameState.selected=null;gameState.revision++;refresh()}
canvas.addEventListener('pointerup',ev=>{const p=pointFromEvent(ev);if(!p||p.y<40||p.y>680)return;let best=null,d=40;if(p.x>=940){const m=legalMoves().find(m=>m.from===gameState.selected&&m.to==='off');if(m)doMove(m);else refresh();return;}if(p.x>=barL&&p.x<=barR){gameState.selected=gameState.bar[gameState.turn]>0?'bar':null;refresh();return;}for(let i=p.y<360?12:0;i<(p.y<360?24:12);i++){const di=Math.abs(p.x-xpos(i));if(di<d){d=di;best=i}}const moves=legalMoves();let target=moves.find(m=>m.from===gameState.selected&&m.to===best);if(target)doMove(target);else{gameState.selected=moves.some(m=>m.from===best)?best:null;refresh()}});
document.getElementById('roll').onclick=()=>{if(gameState.rolled)return;const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);gameState.dice=a===b?[a,a,a,a]:[a,b];gameState.rolled=true;history.length=0;refresh()};
document.getElementById('undo').onclick=()=>{if(!history.length)return;Object.assign(gameState,history.pop());refresh()};
document.getElementById('end').onclick=()=>{if(!gameState.rolled||!canFinish(gameState))return;gameState.turn=gameState.turn==='white'?'black':'white';gameState.viewSide=gameState.turn;document.getElementById('view').textContent='Perspektif: '+(gameState.turn==='white'?'Beyaz':'Siyah');gameState.rolled=false;gameState.dice=[];gameState.selected=null;history.length=0;refresh()};
document.getElementById('view').onclick=()=>{gameState.viewSide=gameState.viewSide==='white'?'black':'white';gameState.selected=null;document.getElementById('view').textContent='Perspektif: '+(gameState.viewSide==='white'?'Beyaz':'Siyah');invalidate()};
document.getElementById('full').onclick=()=>{const el=document.getElementById('app');if(document.fullscreenElement)document.exitFullscreen?.();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{status.textContent='Tarayıcı tam ekranı engelledi.'});else status.textContent='Bu tarayıcıda Fullscreen API yok. Ekranı yatay çevirerek kullanın.'};
function fitCanvas(){const r=document.getElementById('stage').getBoundingClientRect();if(!r.width||!r.height)return;const scale=Math.min(r.width/W,r.height/H);canvas.style.width=Math.floor(W*scale)+'px';canvas.style.height=Math.floor(H*scale)+'px';invalidate()}
new ResizeObserver(fitCanvas).observe(document.getElementById('stage'));document.addEventListener('fullscreenchange',fitCanvas);window.addEventListener('orientationchange',fitCanvas);fitCanvas();refresh();
</script></body></html>
