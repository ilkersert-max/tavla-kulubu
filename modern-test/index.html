<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tavla Kulübü | Yeni motor testi</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#112423;color:#f6e7c6;font:15px system-ui}#app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}.actions{min-width:0;flex-wrap:wrap;justify-content:flex-end}.top strong{font-size:19px}.actions{display:flex;gap:5px}button{background:#27413c;color:#f9dfad;border:1px solid #ae956c;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}#stage{min-height:0;flex:1;display:grid;place-items:center}canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:1000/720;object-fit:contain;touch-action:none;flex:none}footer{font-size:12px;opacity:.8}@media(max-width:600px){.top strong{font-size:14px}.top{align-items:flex-start}.actions{width:100%;justify-content:center}button{font-size:12px;padding:7px}}@media(max-height:450px){footer{display:none}}
</style></head><body><div id="app"><header class="top"><strong>◆ Tavla Kulübü <small style="font-weight:normal;font-size:11px">— yeni motor testi</small></strong><div class="actions"><label style="font-size:12px">Mod <select id="mode"><option value="bot">Bilgisayara Karşı</option><option value="local">İki Kişilik (Lokal)</option></select></label><label style="font-size:12px">Seviye <select id="difficulty"><option value="easy">Kolay</option><option value="medium" selected>Orta</option><option value="hard">Zor</option></select></label><button id="restart">↻ Yeni oyun</button><button id="view">Perspektif: Beyaz</button><button id="full">Tam ekran</button></div></header><div id="stage"><div hidden><button id="roll">Zar at</button><button id="undo">Geri al</button><button id="end">Sırayı bitir</button></div><canvas id="board" width="1000" height="720"></canvas></div><footer id="status">Yerel hamle testi · Önce zar atın.</footer></div><script src="./rules.js"></script><script src="./ai.js"></script><script>
'use strict';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),status=document.getElementById('status');const gameState={points:Array(24).fill(0),turn:'white',viewSide:'white',dice:[],selected:null,bar:{white:0,black:0},off:{white:0,black:0},rolled:false,winner:null,revision:0};for(const [i,n] of [[23,2],[12,5],[7,3],[5,5],[11,-2],[0,-5],[19,-3],[17,-5]])gameState.points[i]=n;const W=1000,H=720,left=64,right=922,barL=479,barR=519;
function xpos(i){const n=i<12?11-i:i-12;const w=(right-left-(barR-barL))/12;return n<6?left+(n+.5)*w:barR+(n-6+.5)*w}
function paint(){ctx.save();const wood=ctx.createLinearGradient(0,0,W,H);wood.addColorStop(0,'#bf854c');wood.addColorStop(.46,'#8b4b24');wood.addColorStop(1,'#cc9761');ctx.fillStyle=wood;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#583018';ctx.lineWidth=9;ctx.strokeRect(5,5,W-10,H-10);if(gameState.viewSide==='black'){ctx.translate(972,H);ctx.rotate(Math.PI)}const felt=ctx.createLinearGradient(30,40,930,680);felt.addColorStop(0,'#74291d');felt.addColorStop(.5,'#542116');felt.addColorStop(1,'#742d1b');ctx.fillStyle=felt;ctx.fillRect(34,40,904,640);ctx.strokeStyle='#d09a60';ctx.lineWidth=5;ctx.strokeRect(33,39,905,642);ctx.fillStyle='#ac6234';ctx.fillRect(barL,40,barR-barL,640);ctx.fillStyle='#713b23';ctx.fillRect(barL+9,43,barR-barL-18,634);for(let i=0;i<24;i++){const x=xpos(i),top=i>=12,y=top?46:674;ctx.beginPath();ctx.moveTo(x-31,y);ctx.lineTo(x+31,y);ctx.lineTo(x,top?310:410);ctx.closePath();ctx.fillStyle=i%2?'#a81919':'#e39a6e';ctx.fill();ctx.save();ctx.fillStyle='#f4d6a9';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(String(i+1),x,top?30:703);ctx.restore();if(gameState.rolled&&legalMoves().some(m=>m.from===i)){ctx.save();ctx.strokeStyle='#9ae9c0';ctx.lineWidth=3;ctx.stroke();ctx.restore()}if(gameState.selected===i){ctx.strokeStyle='#f8dc70';ctx.lineWidth=4;ctx.stroke()}if(legalMoves().some(m=>m.to===i&&m.from===gameState.selected)){ctx.save();ctx.strokeStyle='#f7de68';ctx.lineWidth=5;ctx.stroke();ctx.restore()}}for(let i=0;i<24;i++){const n=gameState.points[i];if(!n)continue;for(let j=0;j<Math.abs(n);j++){const x=xpos(i),y=(i>=12?75:645)+(i>=12?1:-1)*j*37;ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fillStyle=n>0?'#e9d7b7':'#1c303b';ctx.fill();ctx.strokeStyle=n>0?'#947449':'#acd2d5';ctx.lineWidth=3;ctx.stroke()}}// Bar: broken checkers stay visible in both perspectives.
for(const [side,offset] of [['white',-1],['black',1]]){
 const count=gameState.bar[side];if(!count)continue;
 const white=side==='white',cx=499,startY=white?510:210;
 for(let j=0;j<Math.min(count,5);j++){const cy=startY+(white?-1:1)*j*29;ctx.beginPath();ctx.arc(cx,cy,16,0,Math.PI*2);ctx.fillStyle=white?'#e9d7b7':'#1c303b';ctx.fill();ctx.strokeStyle=white?'#947449':'#acd2d5';ctx.lineWidth=2.5;ctx.stroke()}
 if(count>5){ctx.fillStyle='#f7dca2';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('×'+count,cx,startY+(white?-1:1)*158)}
}
if(gameState.selected==='bar'){ctx.strokeStyle='#f7de68';ctx.lineWidth=3;ctx.strokeRect(barL+2,290,barR-barL-4,140)}
ctx.restore();drawBoardHUD();drawBearOffTrays();}
const CONTROL_BOXES=[{id:'roll',x:640,label:'ZAR'},{id:'undo',x:743,label:'GERİ'},{id:'end',x:846,label:'BİTİR'}];
let lastRoll=[0,0];
function drawBoardHUD(){
 const dice=gameState.rolled?gameState.dice:lastRoll;
 const active=gameState.rolled;
 for(let k=0;k<2;k++){
  const x=300+k*77,y=360,n=dice[k]||0;
  ctx.save();ctx.fillStyle=n?(gameState.turn==='white'?'#fff2dc':'#263740'):'#bca88b';ctx.strokeStyle='#b8925d';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-27,y-27,54,54,11);ctx.fill();ctx.stroke();
  if(n){ctx.fillStyle=gameState.turn==='white'?'#28373a':'#f7e5be';const marks={1:[[0,0]],2:[[-12,-12],[12,12]],3:[[-12,-12],[0,0],[12,12]],4:[[-12,-12],[12,-12],[-12,12],[12,12]],5:[[-12,-12],[12,-12],[0,0],[-12,12],[12,12]],6:[[-12,-12],[12,-12],[-12,0],[12,0],[-12,12],[12,12]]};for(const [dx,dy] of marks[n]){ctx.beginPath();ctx.arc(x+dx,y+dy,4.2,0,Math.PI*2);ctx.fill()}}ctx.restore()
 }
 const blocked={roll:gameState.rolled||!!gameState.winner||isBotTurn()||botBusy,undo:!history.length||isBotTurn()||botBusy,end:!!gameState.winner||!gameState.rolled||!canFinish(gameState)||isBotTurn()||botBusy};
 for(const box of CONTROL_BOXES){ctx.save();ctx.globalAlpha=blocked[box.id]?.48:1;ctx.fillStyle='#243e3b';ctx.strokeStyle='#d1ae75';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(box.x-45,337,90,46,12);ctx.fill();ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f8e7c8';ctx.font='bold 18px system-ui';ctx.fillText(box.label,box.x,361);ctx.restore()}
 ctx.fillStyle='#faebc8';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText(active?'Zarlar tahtada':'ZAR ile başla',338,307);
}
function drawBearOffTrays(){
 for(const [side,y] of [['black',78],['white',380]]){
  ctx.fillStyle='#542710';ctx.fillRect(941,y,48,260);ctx.strokeStyle='#c3945e';ctx.lineWidth=2;ctx.strokeRect(942,y,46,260);
  const count=gameState.off[side];const white=side==='white';
  for(let j=0;j<Math.min(count,8);j++){ctx.fillStyle=white?'#eedbb7':'#1d3037';ctx.strokeStyle=white?'#b28b57':'#acc9c6';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(951,y+238-j*26,28,19,5);ctx.fill();ctx.stroke()}
  ctx.fillStyle='#f6deab';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(String(count),965,y+24);
 }
}
let pending=false;function invalidate(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;paint()})}
function rawPointFromEvent(ev){const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H),x0=r.left+(r.width-W*scale)/2,y0=r.top+(r.height-H*scale)/2;let x=(ev.clientX-x0)/scale,y=(ev.clientY-y0)/scale;if(x<0||y<0||x>W||y>H)return null;return{x,y}}
function pointFromEvent(ev){const p=rawPointFromEvent(ev);if(!p)return null;if(gameState.viewSide==='black')return{x:972-p.x,y:H-p.y};return p}
// Core rules are kept independent from Canvas. White moves upward in index, black downward.
const history=[],sideNum=side=>side==='white'?1:-1,owner=n=>n>0?'white':n<0?'black':null;
// Her iki oyuncunun yolu kendi ekranında sağ-alt bölmeye ulaşır.
// Beyaz: 23→...→0; siyah: 11→...→0→23→...→12.
// Siyah için 180° görüntü dönüşü SADECE çizimi etkiler, hamle verisini değil.
// Oyun kuralları Canvas'tan bağımsız rules.js dosyasından yüklenir.
const {legalMoves:validatedMoves,canFinish:validatedFinish,move:validatedMove}=TavlaRules;
function legalMoves(){return validatedMoves(gameState)}
function canFinish(x){return validatedFinish(x)}
function cloneState(x){return {...TavlaRules.copy(x),viewSide:x.viewSide,selected:x.selected,revision:x.revision}}
function simulate(x,m){Object.assign(x,validatedMove(x,m))}
let botBusy=false,botJob=0;const isBotTurn=()=>document.getElementById('mode').value==='bot'&&gameState.turn==='black';
function refresh(){document.getElementById('roll').disabled=gameState.rolled||!!gameState.winner||isBotTurn()||botBusy;document.getElementById('undo').disabled=!history.length||isBotTurn()||botBusy;document.getElementById('end').disabled=!!gameState.winner||!gameState.rolled||!canFinish(gameState)||isBotTurn()||botBusy;const msg=gameState.rolled?(gameState.dice.length?'Zarlar: '+gameState.dice.join(', ')+' · Yeşil işaretli pulunu seç, sonra sarı hedefe dokun.': 'Hamleler tamamlandı · Sırayı bitir'):'Zar atılacak';status.textContent=(gameState.winner?(gameState.winner==='white'?'Beyaz':'Siyah')+' kazandı!':(gameState.turn==='white'?'Beyaz':'Siyah')+' oynuyor · '+msg)+' · Kırık: '+gameState.bar.white+'/'+gameState.bar.black+' · Toplanan: '+gameState.off.white+'/'+gameState.off.black;invalidate()}
function doMove(m){if(botBusy&&gameState.turn!=='black')return;history.push(cloneState(gameState));simulate(gameState,m);if(gameState.off[gameState.turn]===15)gameState.winner=gameState.turn;gameState.selected=null;gameState.revision++;refresh()}
canvas.addEventListener('pointerup',ev=>{if(isBotTurn()||botBusy||gameState.winner)return;const raw=rawPointFromEvent(ev);if(!raw)return;for(const box of CONTROL_BOXES){if(Math.abs(raw.x-box.x)<=45&&raw.y>=337&&raw.y<=383){document.getElementById(box.id).click();return}}const p=pointFromEvent(ev);if(!p||p.y<40||p.y>680)return;let best=null,d=40;if(raw.x>=940&&raw.x<=995){const m=legalMoves().find(m=>m.from===gameState.selected&&m.to==='off');if(m)doMove(m);else refresh();return;}if(p.x>=barL&&p.x<=barR){gameState.selected=gameState.bar[gameState.turn]>0?'bar':null;refresh();return;}for(let i=p.y<360?12:0;i<(p.y<360?24:12);i++){const di=Math.abs(p.x-xpos(i));if(di<d){d=di;best=i}}const moves=legalMoves();let target=moves.find(m=>m.from===gameState.selected&&m.to===best);if(target)doMove(target);else{gameState.selected=moves.some(m=>m.from===best)?best:null;refresh()}});
document.getElementById('roll').onclick=()=>{if(gameState.rolled||gameState.winner||isBotTurn()||botBusy)return;const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);gameState.dice=a===b?[a,a,a,a]:[a,b];gameState.rolled=true;lastRoll=[a,b];history.length=0;refresh()};
document.getElementById('undo').onclick=()=>{if(!history.length||isBotTurn()||botBusy)return;Object.assign(gameState,history.pop());refresh()};
document.getElementById('end').onclick=()=>{if(gameState.winner||!gameState.rolled||!canFinish(gameState)||isBotTurn()||botBusy)return;gameState.turn=gameState.turn==='white'?'black':'white';/* Kamera yönü sıradan bağımsızdır: viewSide değiştirilmez. */gameState.rolled=false;gameState.dice=[];gameState.selected=null;history.length=0;refresh();if(isBotTurn())runBotTurn()};
function runBotTurn(){if(!isBotTurn()||gameState.winner||botBusy)return;botBusy=true;const job=++botJob;refresh();const wait=fn=>setTimeout(()=>{if(job===botJob)fn()},170);
 wait(()=>{if(!isBotTurn()||gameState.winner){botBusy=false;refresh();return}const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);gameState.dice=a===b?[a,a,a,a]:[a,b];gameState.rolled=true;lastRoll=[a,b];refresh();const step=()=>{if(job!==botJob)return;if(gameState.winner){botBusy=false;refresh();return}const m=TavlaAI.choose(gameState,document.getElementById('difficulty').value);if(m){doMove(m);wait(step)}else{gameState.turn='white';gameState.rolled=false;gameState.dice=[];gameState.selected=null;history.length=0;botBusy=false;refresh()}};wait(step)})}
document.getElementById('restart').onclick=()=>{botJob++;botBusy=false;const initial=TavlaRules.initial();Object.assign(gameState,initial,{viewSide:gameState.viewSide,selected:null,revision:gameState.revision+1});history.length=0;lastRoll=[0,0];refresh()};
document.getElementById('mode').onchange=()=>{botJob++;botBusy=false;document.getElementById('difficulty').disabled=document.getElementById('mode').value!=='bot';document.getElementById('restart').click()};
document.getElementById('view').onclick=()=>{gameState.viewSide=gameState.viewSide==='white'?'black':'white';gameState.selected=null;document.getElementById('view').textContent='Perspektif: '+(gameState.viewSide==='white'?'Beyaz':'Siyah');invalidate()};
document.getElementById('full').onclick=()=>{const el=document.getElementById('app');if(document.fullscreenElement)document.exitFullscreen?.();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{status.textContent='Tarayıcı tam ekranı engelledi.'});else status.textContent='Bu tarayıcıda Fullscreen API yok. Ekranı yatay çevirerek kullanın.'};
function fitCanvas(){const r=document.getElementById('stage').getBoundingClientRect();if(!r.width||!r.height)return;const scale=Math.min(r.width/W,r.height/H);canvas.style.width=Math.floor(W*scale)+'px';canvas.style.height=Math.floor(H*scale)+'px';invalidate()}
new ResizeObserver(fitCanvas).observe(document.getElementById('stage'));document.addEventListener('fullscreenchange',fitCanvas);window.addEventListener('orientationchange',fitCanvas);fitCanvas();refresh();
</script></body></html>
