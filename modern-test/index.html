<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tavla Kulübü | Yeni motor testi</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#112423;color:#f6e7c6;font:15px system-ui}#app{height:100dvh;display:flex;flex-direction:column;gap:6px;padding:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:6px}.top strong{font-size:19px}.actions{display:flex;gap:5px}button{background:#27413c;color:#f9dfad;border:1px solid #ae956c;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}#stage{min-height:0;flex:1;display:grid;place-items:center}canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:1000/720;object-fit:contain;touch-action:none;flex:none}footer{font-size:12px;opacity:.8}@media(max-width:600px){.top strong{font-size:14px}button{font-size:12px;padding:7px}}@media(max-height:450px){footer{display:none}}
</style></head><body><div id="app"><header class="top"><strong>◆ Tavla Kulübü <small style="font-weight:normal;font-size:11px">— yeni motor testi</small></strong><div class="actions"><button id="view">Perspektif: Beyaz</button><button id="full">Tam ekran</button></div></header><div id="stage"><canvas id="board" width="1000" height="720"></canvas></div><footer id="status">Tahta ve perspektif testi · Henüz oynanabilir oyun değildir.</footer></div><script>
'use strict';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),status=document.getElementById('status');const gameState={points:Array(24).fill(0),turn:'white',viewSide:'white',dice:[],selected:null,revision:0};for(const [i,n] of [[0,2],[11,5],[16,3],[18,5],[5,-5],[7,-3],[12,-5],[23,-2]])gameState.points[i]=n;const W=1000,H=720,left=64,right=922,barL=479,barR=519;
function xpos(i){const n=i<12?11-i:i-12;const w=(right-left-(barR-barL))/12;return n<6?left+(n+.5)*w:barR+(n-6+.5)*w}
function paint(){ctx.save();ctx.fillStyle='#caa477';ctx.fillRect(0,0,W,H);if(gameState.viewSide==='black'){ctx.translate(W,H);ctx.rotate(Math.PI)}ctx.fillStyle='#16485e';ctx.fillRect(34,40,904,640);ctx.fillStyle='#89502e';ctx.fillRect(barL,40,barR-barL,640);for(let i=0;i<24;i++){const x=xpos(i),top=i>=12,y=top?46:674;ctx.beginPath();ctx.moveTo(x-31,y);ctx.lineTo(x+31,y);ctx.lineTo(x,top?310:410);ctx.closePath();ctx.fillStyle=i%2?'#cd5e52':'#f3e9d8';ctx.fill();if(gameState.selected===i){ctx.strokeStyle='#f8dc70';ctx.lineWidth=4;ctx.stroke()}}for(let i=0;i<24;i++){const n=gameState.points[i];if(!n)continue;for(let j=0;j<Math.abs(n);j++){const x=xpos(i),y=(i>=12?75:645)+(i>=12?1:-1)*j*37;ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fillStyle=n>0?'#e9d7b7':'#1c303b';ctx.fill();ctx.strokeStyle=n>0?'#947449':'#acd2d5';ctx.lineWidth=3;ctx.stroke()}}ctx.restore();ctx.fillStyle='#202b2b';ctx.fillRect(940,104,46,512);ctx.fillStyle='#f7d9a9';ctx.font='bold 14px system-ui';ctx.save();ctx.translate(967,360);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('TOPLAMA →',0,0);ctx.restore()}
let pending=false;function invalidate(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;paint()})}
function pointFromEvent(ev){const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H),x0=r.left+(r.width-W*scale)/2,y0=r.top+(r.height-H*scale)/2;let x=(ev.clientX-x0)/scale,y=(ev.clientY-y0)/scale;if(x<0||y<0||x>W||y>H)return null;if(gameState.viewSide==='black'){x=W-x;y=H-y}return{x,y}}
canvas.addEventListener('pointerup',ev=>{const p=pointFromEvent(ev);if(!p)return;if(p.y<40||p.y>680)return;let best=null,d=40;for(let i=p.y<360?12:0;i<(p.y<360?24:12);i++){const di=Math.abs(p.x-xpos(i));if(di<d){d=di;best=i}}gameState.selected=best;gameState.revision++;invalidate();status.textContent=best===null?'Alan seçilmedi':'Seçilen nokta: '+(best+1)});
document.getElementById('view').onclick=()=>{gameState.viewSide=gameState.viewSide==='white'?'black':'white';gameState.selected=null;document.getElementById('view').textContent='Perspektif: '+(gameState.viewSide==='white'?'Beyaz':'Siyah');invalidate()};
document.getElementById('full').onclick=()=>{const el=document.getElementById('app');if(document.fullscreenElement)document.exitFullscreen?.();else if(el.requestFullscreen)el.requestFullscreen().catch(()=>{status.textContent='Tarayıcı tam ekranı engelledi.'});else status.textContent='Bu tarayıcıda Fullscreen API yok. Ekranı yatay çevirerek kullanın.'};
function fitCanvas(){const r=document.getElementById('stage').getBoundingClientRect();if(!r.width||!r.height)return;const scale=Math.min(r.width/W,r.height/H);canvas.style.width=Math.floor(W*scale)+'px';canvas.style.height=Math.floor(H*scale)+'px';invalidate()}
new ResizeObserver(fitCanvas).observe(document.getElementById('stage'));document.addEventListener('fullscreenchange',fitCanvas);window.addEventListener('orientationchange',fitCanvas);fitCanvas();
</script></body></html>
