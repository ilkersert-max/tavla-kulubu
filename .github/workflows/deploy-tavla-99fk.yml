name: Publish original 99fk Backgammon

on:
  push:
    branches: [main]
    paths:
      - "tavla-99fk/**"
      - ".github/workflows/deploy-tavla-99fk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify original game assets
        run: |
          test -s tavla-99fk/public/index.html
          test -s tavla-99fk/public/bg-online.html
          test -s tavla-99fk/public/LICENSE
          node --check tavla-99fk/src/index.js
      - name: Deploy standalone 99fk Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tavla-99fk
          command: deploy
