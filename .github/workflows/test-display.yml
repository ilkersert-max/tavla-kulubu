name: Display regression tests
on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/display-regression.cjs
      - .github/workflows/test-display.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fullscreen and layout states
        run: node tests/display-regression.cjs
